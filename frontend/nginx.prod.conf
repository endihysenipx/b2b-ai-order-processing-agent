upstream order_agent_backend {
    server backend:8000;
    keepalive 16;
}

limit_req_zone $binary_remote_addr zone=mcp_per_ip:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=10r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 30m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        return 200;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location ~ ^/\.well-known/(oauth-authorization-server|oauth-protected-resource/mcp)$ {
        proxy_pass http://order_agent_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(authorize|register|token)$ {
        limit_req zone=auth_per_ip burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://order_agent_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://order_agent_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location ~ ^/api/v1/(auth/(login|password/change|2fa/(setup|enable|verify))|oauth/authorize/complete)$ {
        limit_req zone=auth_per_ip burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://order_agent_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /mcp {
        limit_req zone=mcp_per_ip burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://order_agent_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /health {
        proxy_pass http://order_agent_backend;
        proxy_set_header Host $host;
    }

    location = /docs {
        proxy_pass http://order_agent_backend;
        proxy_set_header Host $host;
    }

    location = /openapi.json {
        proxy_pass http://order_agent_backend;
        proxy_set_header Host $host;
    }

    location = /redoc {
        proxy_pass http://order_agent_backend;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
